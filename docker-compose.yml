services:
  vaultwarden:
    image: vaultwarden/server:1.37.4-alpine
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - "${VAULTWARDEN_DATA}:/data"
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "${VAULTWARDEN_ALLOW_REGISTER}"
    labels:
      caddyfile: |
        ${VAULTWARDEN_WEB_HOST} {
            header -Server
            encode gzip
            reverse_proxy vaultwarden:80
        }
